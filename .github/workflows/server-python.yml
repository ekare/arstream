name: server-python

on:
  push:
    branches: [master, ci/m7-github-actions]
    paths:
      - "server/**"
      - "fixtures/**"
      - ".github/workflows/server-python.yml"
  pull_request:
    paths:
      - "server/**"
      - "fixtures/**"
      - ".github/workflows/server-python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install arstream-server (+ dev deps)
        working-directory: server
        run: pip install -e ".[dev]"

      - name: pytest
        working-directory: server
        run: pytest tests/ -v
